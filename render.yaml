# Render blueprint for Bhav — two services, both free, no card required.
#
#   bhav-web    the site (static files, on Render's CDN)
#   bhav-api    the signal (FastAPI in a container)
#
# WhatsApp delivery (whatsapp/) is deliberately NOT in this blueprint. It needs
# a disk and an always-on instance — open-wa drives a real Chromium, and a free
# instance that sleeps after 15 idle minutes would tear the WhatsApp Web session
# down and rebuild it constantly, which is how the linked account gets flagged.
# Render only sells disks on paid plans, so there's no free way to run it here.
#
# The site and the signal work fully without it — the registration form just
# reports delivery as unavailable until a bridge exists. When you're ready to
# add one, see the "adding the bridge back" block at the bottom of this file
# and the "Delivery" section of DEPLOY.md, which also covers self-hosting the
# bridge on your own always-on machine instead of paying Render for it.
#
# Deploy: push this repo to GitHub, then Render -> New -> Blueprint and point it
# here. Two values have to be filled in by hand afterwards; each is marked
# `sync: false` and explained below. Full walkthrough in DEPLOY.md.

services:
  # --- the site ---------------------------------------------------------------
  - type: web
    name: bhav-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Vite inlines VITE_API_URL at *build* time, so changing it needs a rebuild,
    # not just a restart. Set it to the API's full URL including the scheme:
    #   https://bhav-api.onrender.com
    # (A blueprint cannot compose that string from the service reference, which
    # yields a bare hostname — hence sync: false.)
    envVars:
      - key: VITE_API_URL
        sync: false
    headers:
      # The build fingerprints every asset filename, so they can be cached hard;
      # index.html must not be, or a deploy is invisible until someone clears
      # their browser.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      # The app uses hash routes (#/today), so this is only a safety net for
      # anyone who hand-types a path.
      - type: rewrite
        source: /*
        destination: /index.html

  # --- the signal -------------------------------------------------------------
  - type: web
    name: bhav-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore          # closest to Nashik; move it if your users aren't
    # /health touches neither the database nor the model, so a slow first query
    # cannot fail a healthy deploy. /readyz is the one that reports whether
    # there is anything to serve.
    healthCheckPath: /health
    # No `disk:` here — Render only sells those on paid plans. The API still
    # works fully: the shipped snapshot (data/seed.db) is baked into the image,
    # so every deploy serves a real signal from its first request. What is lost
    # is persistence — the container filesystem is wiped on each deploy, so any
    # registrations taken since the last deploy go with it. Add a disk later
    # (see DEPLOY.md's "Persisting data" section) once that matters to you; it
    # is a one-line addition, no code changes.
    envVars:
      # `refresh` matters even without a disk: it's what makes a later push
      # carrying a fresher data/seed.db actually take effect on restart, rather
      # than a stale in-image copy silently winning. Harmless without a disk.
      - key: BHAV_SEED_MODE
        value: refresh
      # Guards /broadcast, /message/send and the subscriber endpoints. Generated
      # once and visible in the Render dashboard — you'll need it once a bridge
      # exists to link the sending phone (see DEPLOY.md).
      - key: BHAV_ADMIN_TOKEN
        generateValue: true
      # No WhatsApp bridge is deployed yet (see the header note). Leave these
      # blank and the API reports delivery as unavailable rather than failing —
      # /delivery/status returns `reachable: false`, and registration still
      # works. Fill both in once a bridge exists, whether that's Render's
      # bhav-whatsapp (see the block at the end of this file) or one you run
      # yourself and reach over a tunnel — WA_BRIDGE_URL accepts a bare
      # `host:port` or a full URL either way.
      - key: WA_BRIDGE_URL
        sync: false
      - key: WA_BRIDGE_TOKEN
        sync: false
      # Lock this to your site's origin once you know it —
      # https://bhav-web.onrender.com — rather than leaving the default "*".
      - key: BHAV_CORS_ORIGINS
        sync: false

# --- adding the bridge back --------------------------------------------------
#
# When you're ready to pay for always-on delivery, add this service back and
# swap the two `sync: false` bridge entries above for the `fromService` wiring
# that ties them together automatically:
#
#   - type: pserv
#     name: bhav-whatsapp
#     runtime: docker
#     dockerfilePath: ./whatsapp/Dockerfile
#     dockerContext: ./whatsapp
#     plan: starter        # free sleeps; a torn-down WA session risks a ban
#     region: singapore
#     # pserv has no public URL, so Render rejects healthCheckPath here — the
#     # Docker HEALTHCHECK in whatsapp/Dockerfile gates deploys instead.
#     disk:
#       name: bhav-wa-session
#       mountPath: /var/data
#       sizeGB: 2           # the linked account is a Chrome profile on this disk
#     envVars:
#       - key: WA_SESSION_DIR
#         value: /var/data/wa-sessions
#       - key: WA_CHROME_PATH
#         value: /usr/bin/chromium
#       - key: WA_BRIDGE_TOKEN
#         generateValue: true
#       - key: WA_REQUIRE_TOKEN
#         value: "1"
#       - key: BHAV_API_URL
#         fromService: { name: bhav-api, type: web, property: hostport }
#
# and on bhav-api, replace the two sync:false bridge entries with:
#
#       - key: WA_BRIDGE_TOKEN
#         fromService: { name: bhav-whatsapp, type: pserv, envVarKey: WA_BRIDGE_TOKEN }
#       - key: WA_BRIDGE_URL
#         fromService: { name: bhav-whatsapp, type: pserv, property: hostport }
